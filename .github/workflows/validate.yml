name: Package validation

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/package-validation"
          "$RUNNER_TEMP/package-validation/bin/python3" -m pip install --only-binary=:all: -r tests/requirements.txt
          echo "$RUNNER_TEMP/package-validation/bin" >> "$GITHUB_PATH"
      - name: Validate package
        run: python3 tests/validate_package.py
      - name: Test the validator
        run: python3 tests/test_validate_package.py
